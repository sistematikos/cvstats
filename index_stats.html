<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Voley PRO | Panel Estadístico</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- SCRIPT DE SEGURIDAD Y BLOQUEO -->
    <script src="security.js"></script>

    <script>
        tailwind.config = {
          theme: {
            extend: {
              fontFamily: {
                sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              },
              colors: {
                brand: {
                  50: '#f0f6ff',
                  100: '#e0edff',
                  500: '#0066ff',
                  600: '#0052cc',
                  700: '#003db3',
                  electric: '#0055FF',
                  cyan: '#00D2FF',
                  orange: '#FF5500',
                  dark: '#030B1E'
                }
              },
              boxShadow: {
                'electric': '0 10px 30px -5px rgba(0, 85, 255, 0.3)',
                'glass': '0 20px 40px rgba(0, 31, 63, 0.05)',
              }
            }
          }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }
        .bg-sports-pattern {
            background-color: #F1F5F9;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 85, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(241, 245, 249, 0.5) 0px, transparent 100%);
        }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.8); }
        .card-atleta-item { border: 2px solid #E2E8F0; background: white; transition: all 0.2s ease; }
        .card-atleta-item:hover { border-color: #0055FF; }
        .card-atleta-selected { border-color: #0055FF !important; background-color: #F0F6FF !important; box-shadow: 0 4px 12px rgba(0, 85, 255, 0.15); }
    </style>
</head>
<body class="bg-sports-pattern min-h-screen text-slate-800 antialiased pb-12" oncontextmenu="return false">

    <!-- HEADER / CABECERA -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-electric to-brand-cyan flex items-center justify-center text-white shadow-electric">
                    <i class="fas fa-volleyball text-lg"></i>
                </div>
                <div>
                    <h1 class="text-sm font-black text-slate-900 uppercase tracking-tight">Control Voley PRO</h1>
                    <span id="userEmail" class="text-[10px] font-bold text-slate-500 flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> Conectando...
                    </span>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button id="btnExportarPdf" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition flex items-center gap-1.5">
                    <i class="fas fa-print"><span>Imprimir / PDF</span></i>
                </button>
                <button id="ra" class="px-3 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold rounded-xl transition flex items-center gap-1.5 border border-rose-200">
                    <i class="fas fa-trash-alt"></i> <span>Reiniciar Todo</span>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- COLUMNA IZQUIERDA: ROSTER Y REGISTRO TÁCTIL (Cols 1 a 7) -->
        <div class="lg:col-span-7 space-y-6">

            <!-- PASO 1: SELECCIÓN DE ATLETAS / ROSTER -->
            <div class="glass-card p-5 rounded-3xl shadow-glass space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-xs font-black uppercase text-slate-900 tracking-wider flex items-center gap-2">
                        <span class="w-5 h-5 rounded-lg bg-brand-50 text-brand-electric flex items-center justify-center text-[10px] font-black border border-brand-electric/20">1</span>
                        Roster del Partido (<span id="countRoster">0</span> atletas)
                    </h2>
                    <span id="atletaSeleccionadoBadge" class="hidden px-2.5 py-1 rounded-xl bg-brand-50 text-brand-electric text-xs font-black border border-brand-electric/30 animate-pulse">
                        Activo: <span id="nombreAtletaSel">Ninguno</span>
                    </span>
                </div>

                <!-- Controles para agregar atletas -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div class="flex gap-2">
                        <select id="selectNomina" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold outline-none focus:ring-2 focus:ring-brand-electric">
                            <option value="">Seleccione de Nómina...</option>
                        </select>
                        <button id="btnAgregarNomina" class="px-4 py-2.5 bg-brand-electric hover:bg-brand-600 text-white font-bold rounded-xl text-xs shadow-electric transition">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                    <div class="flex gap-2">
                        <input type="number" id="manualNum" placeholder="#" class="w-16 p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-center font-bold outline-none focus:ring-2 focus:ring-brand-electric">
                        <input type="text" id="manualNom" placeholder="Nombre Invitado" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold outline-none focus:ring-2 focus:ring-brand-electric">
                        <button id="btnAgregarManual" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl text-xs transition">
                            <i class="fas fa-user-plus"></i>
                        </button>
                    </div>
                </div>

                <!-- Grid de tarjetas de atletas en el roster -->
                <div id="rosterCardsGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 max-h-48 overflow-y-auto p-1">
                    <!-- Las tarjetas se generan dinámicamente -->
                </div>
            </div>

            <!-- PASO 2: BOTONERA DE ACCIONES TÁCTILES -->
            <div class="glass-card p-5 rounded-3xl shadow-glass space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-xs font-black uppercase text-slate-900 tracking-wider flex items-center gap-2">
                        <span class="w-5 h-5 rounded-lg bg-brand-50 text-brand-electric flex items-center justify-center text-[10px] font-black border border-brand-electric/20">2</span>
                        Registro Táctil de Acciones
                    </h2>
                    <button id="btnDeshacer" class="text-xs font-bold text-rose-600 hover:text-rose-700 bg-rose-50 px-2.5 py-1 rounded-lg border border-rose-200 transition flex items-center gap-1">
                        <i class="fas fa-undo text-[10px]"></i> Deshacer Última
                    </button>
                </div>

                <!-- Botones por Fundamento (Positivo / Error) -->
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    <!-- Servicio -->
                    <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 flex flex-col gap-2">
                        <span class="text-[11px] font-black uppercase text-slate-700 text-center">Servicio</span>
                        <div class="grid grid-cols-2 gap-1.5">
                            <button onclick="window.registrarAccionDirecta('Servicio#')" class="py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-black rounded-xl shadow-xs transition">Punto (#)</button>
                            <button onclick="window.registrarAccionDirecta('Servicio=')" class="py-2 bg-orange-600 hover:bg-orange-700 text-white text-xs font-black rounded-xl shadow-xs transition">Error (=)</button>
                        </div>
                    </div>
                    <!-- Ataque -->
                    <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 flex flex-col gap-2">
                        <span class="text-[11px] font-black uppercase text-slate-700 text-center">Ataque</span>
                        <div class="grid grid-cols-2 gap-1.5">
                            <button onclick="window.registrarAccionDirecta('Ataque#')" class="py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-black rounded-xl shadow-xs transition">Punto (#)</button>
                            <button onclick="window.registrarAccionDirecta('Ataque=')" class="py-2 bg-orange-600 hover:bg-orange-700 text-white text-xs font-black rounded-xl shadow-xs transition">Error (=)</button>
                        </div>
                    </div>
                    <!-- Bloqueo -->
                    <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 flex flex-col gap-2">
                        <span class="text-[11px] font-black uppercase text-slate-700 text-center">Bloqueo</span>
                        <div class="grid grid-cols-2 gap-1.5">
                            <button onclick="window.registrarAccionDirecta('Bloqueo#')" class="py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-black rounded-xl shadow-xs transition">Punto (#)</button>
                            <button onclick="window.registrarAccionDirecta('Bloqueo=')" class="py-2 bg-orange-600 hover:bg-orange-700 text-white text-xs font-black rounded-xl shadow-xs transition">Error (=)</button>
                        </div>
                    </div>
                    <!-- Coloque -->
                    <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 flex flex-col gap-2">
                        <span class="text-[11px] font-black uppercase text-slate-700 text-center">Coloque</span>
                        <div class="grid grid-cols-2 gap-1.5">
                            <button onclick="window.registrarAccionDirecta('Coloque#')" class="py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-black rounded-xl shadow-xs transition">Punto (#)</button>
                            <button onclick="window.registrarAccionDirecta('Coloque=')" class="py-2 bg-orange-600 hover:bg-orange-700 text-white text-xs font-black rounded-xl shadow-xs transition">Error (=)</button>
                        </div>
                    </div>
                    <!-- Recepción -->
                    <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 flex flex-col gap-2">
                        <span class="text-[11px] font-black uppercase text-slate-700 text-center">Recepción</span>
                        <div class="grid grid-cols-2 gap-1.5">
                            <button onclick="window.registrarAccionDirecta('Recepción#')" class="py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-black rounded-xl shadow-xs transition">Bien (#)</button>
                            <button onclick="window.registrarAccionDirecta('Recepción=')" class="py-2 bg-orange-600 hover:bg-orange-700 text-white text-xs font-black rounded-xl shadow-xs transition">Mal (=)</button>
                        </div>
                    </div>
                    <!-- Defensa -->
                    <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 flex flex-col gap-2">
                        <span class="text-[11px] font-black uppercase text-slate-700 text-center">Defensa</span>
                        <div class="grid grid-cols-2 gap-1.5">
                            <button onclick="window.registrarAccionDirecta('Defensa#')" class="py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-black rounded-xl shadow-xs transition">Bien (#)</button>
                            <button onclick="window.registrarAccionDirecta('Defensa=')" class="py-2 bg-orange-600 hover:bg-orange-700 text-white text-xs font-black rounded-xl shadow-xs transition">Mal (=)</button>
                        </div>
                    </div>
                </div>

                <!-- Controles de Sets y Partido -->
                <div class="flex gap-2 pt-2">
                    <button id="rs" class="w-1/2 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-black rounded-xl text-xs uppercase tracking-wider transition">
                        <i class="fas fa-flag-checkered mr-1"></i> Culminar Set Actual
                    </button>
                    <button id="btnCulminarPartido" class="w-1/2 py-3 bg-slate-800 hover:bg-slate-900 text-white font-black rounded-xl text-xs uppercase tracking-wider transition">
                        <i class="fas fa-trophy mr-1 text-amber-400"></i> Culminar Partido
                    </button>
                </div>
            </div>
        </div>

        <!-- COLUMNA DERECHA: ESTADÍSTICAS Y GRÁFICOS (Cols 8 a 12) -->
        <div class="lg:col-span-5 space-y-6">

            <!-- INFORMACIÓN DEL PARTIDO -->
            <div class="glass-card p-5 rounded-3xl shadow-glass space-y-3">
                <div class="flex justify-between items-center text-xs font-bold text-slate-500">
                    <span id="fechaJuegoDisplay">--/--/----</span>
                    <span class="text-brand-electric font-black uppercase">En Vivo</span>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Equipo Local</label>
                        <input type="text" id="equipoLocal" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-black text-slate-900 outline-none focus:ring-2 focus:ring-brand-electric">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Equipo Rival</label>
                        <input type="text" id="equipoRival" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-black text-slate-900 outline-none focus:ring-2 focus:ring-brand-electric">
                    </div>
                </div>
            </div>

            <!-- CUADRO DE HONOR (MVP / RECONOCIMIENTOS) -->
            <div class="glass-card p-5 rounded-3xl shadow-glass space-y-3">
                <h2 class="text-xs font-black uppercase text-slate-900 tracking-wider flex items-center gap-2">
                    <i class="fas fa-award text-amber-500 text-sm"></i> Cuadro de Honor
                </h2>
                <div id="cuadroHonorGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <!-- Se llena dinámicamente -->
                </div>
            </div>

            <!-- RESUMEN EN TIEMPO REAL -->
            <div class="glass-card p-5 rounded-3xl shadow-glass space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-xs font-black uppercase text-slate-900 tracking-wider flex items-center gap-2">
                        <i class="fas fa-chart-bar text-brand-electric"></i> Estadísticas por Atleta
                    </h2>
                </div>
                <div id="st" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                    <!-- Acciones individuales por jugador -->
                </div>
            </div>

            <!-- GRÁFICOS ANALÍTICOS -->
            <div class="glass-card p-5 rounded-3xl shadow-glass space-y-4">
                <h2 class="text-xs font-black uppercase text-slate-900 tracking-wider">Rendimiento Gráfico</h2>
                <div id="sum" class="text-xs font-bold text-slate-600 text-center"></div>
                <div class="h-48 relative"><canvas id="c1"></canvas></div>
                <div class="h-48 relative pt-2 border-t border-slate-100"><canvas id="c2"></canvas></div>
            </div>

        </div>

    </main>

    <!-- NOTIFICACIÓN TOAST FLOTANTE -->
    <div id="toastNotificacion" class="fixed bottom-6 right-6 z-50 transform translate-y-4 opacity-0 transition-all duration-300 pointer-events-none">
        <div class="bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 border border-slate-800">
            <div class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></div>
            <span id="toastTexto" class="text-xs font-bold">Notificación</span>
        </div>
    </div>

    <!-- SCRIPT ESTADÍSTICO PRINCIPAL -->
    <script type="module" src="stats.js"></script>
</body>
</html>
